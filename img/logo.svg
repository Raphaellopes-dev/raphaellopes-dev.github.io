<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="50%" stop-color="#00cc77"/>
      <stop offset="100%" stop-color="#009955"/>
    </linearGradient>
    <linearGradient id="rGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e0ffe8"/>
      <stop offset="70%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00cc77"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00cc77" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer hexagon shape -->
  <path d="M256 20 L470 138 L470 374 L256 492 L42 374 L42 138 Z" fill="url(#bg)" stroke="url(#border)" stroke-width="2.5" opacity="0.9"/>

  <!-- Inner hex ring -->
  <path d="M256 52 L434 150 L434 362 L256 460 L78 362 L78 150 Z" fill="none" stroke="url(#border)" stroke-width="0.6" opacity="0.25"/>

  <!-- Circuit lines - top left -->
  <path d="M120 160 L140 160 L140 190 L160 190" fill="none" stroke="url(#accent)" stroke-width="1.2" opacity="0.3"/>
  <circle cx="160" cy="190" r="3" fill="#00ff88" opacity="0.4"/>

  <!-- Circuit lines - top right -->
  <path d="M392 160 L372 160 L372 190 L352 190" fill="none" stroke="url(#accent)" stroke-width="1.2" opacity="0.3"/>
  <circle cx="352" cy="190" r="3" fill="#00ff88" opacity="0.4"/>

  <!-- Circuit lines - bottom -->
  <path d="M160 340 L180 340 L180 370 L200 370" fill="none" stroke="url(#accent)" stroke-width="1.2" opacity="0.3"/>
  <circle cx="200" cy="370" r="3" fill="#00ff88" opacity="0.4"/>
  <path d="M352 340 L332 340 L332 370 L312 370" fill="none" stroke="url(#accent)" stroke-width="1.2" opacity="0.3"/>
  <circle cx="312" cy="370" r="3" fill="#00ff88" opacity="0.4"/>

  <!-- Orbital rings -->
  <ellipse cx="256" cy="256" rx="175" ry="65" fill="none" stroke="url(#border)" stroke-width="0.5" opacity="0.12" transform="rotate(-25 256 256)"/>
  <ellipse cx="256" cy="256" rx="175" ry="65" fill="none" stroke="url(#border)" stroke-width="0.5" opacity="0.12" transform="rotate(25 256 256)"/>

  <!-- Quantum dots on orbitals -->
  <circle cx="422" cy="224" r="2" fill="#00ff88" opacity="0.3"/>
  <circle cx="90" cy="288" r="2" fill="#00ff88" opacity="0.3"/>
  <circle cx="328" cy="136" r="2" fill="#00cc77" opacity="0.25"/>
  <circle cx="184" cy="376" r="2" fill="#00cc77" opacity="0.25"/>

  <!-- Main letter R -->
  <g filter="url(#glow)">
    <path d="
      M 196 340
      L 196 172
      L 278 172
      Q 320 172 320 210
      Q 320 240 292 256
      Q 320 265 334 285
      L 340 294
      L 316 294
      L 290 260
      Q 260 250 240 250
      L 240 340
      Z
      M 240 230
      L 274 230
      Q 294 230 294 210
      Q 294 192 274 192
      L 240 192
      Z
    " fill="url(#rGrad)"/>
  </g>

  <!-- Terminal cursor accent -->
  <g filter="url(#softGlow)">
    <rect x="194" y="369" width="4" height="16" rx="1" fill="#00ff88" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Corner brackets (code theme) -->
  <path d="M 100 130 L 115 130 L 115 145" fill="none" stroke="url(#border)" stroke-width="1.2" opacity="0.25"/>
  <path d="M 412 130 L 397 130 L 397 145" fill="none" stroke="url(#border)" stroke-width="1.2" opacity="0.25"/>
  <path d="M 100 382 L 115 382 L 115 367" fill="none" stroke="url(#border)" stroke-width="1.2" opacity="0.25"/>
  <path d="M 412 382 L 397 382 L 397 367" fill="none" stroke="url(#border)" stroke-width="1.2" opacity="0.25"/>

  <!-- Outer glow -->
  <path d="M256 20 L470 138 L470 374 L256 492 L42 374 L42 138 Z" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.08" filter="url(#glow)"/>
</svg>
