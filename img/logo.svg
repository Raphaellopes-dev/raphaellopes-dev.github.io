<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }
      @keyframes scan { 0% { transform:translateY(-100%); } 100% { transform:translateY(100%); } }
      @keyframes glitch1 { 0%,100% { transform:translate(0); } 20% { transform:translate(-3px,2px); } 40% { transform:translate(3px,-1px); } 60% { transform:translate(-2px,-2px); } 80% { transform:translate(2px,1px); } }
      @keyframes glitch2 { 0%,100% { transform:translate(0); opacity:0; } 20% { opacity:0.4; transform:translate(4px,-3px); } 50% { opacity:0; } 70% { opacity:0.3; transform:translate(-3px,2px); } 85% { opacity:0; } }
      @keyframes glitch3 { 0%,100% { transform:translate(0); opacity:0; } 15% { opacity:0.3; transform:translate(-5px,1px); } 45% { opacity:0; } 65% { opacity:0.25; transform:translate(4px,3px); } 80% { opacity:0; } }
      @keyframes orbit { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
      @keyframes orbitReverse { 0% { transform:rotate(0deg); } 100% { transform:rotate(-360deg); } }
      @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }
      @keyframes matrixFall { 0% { transform:translateY(-20px); opacity:0; } 10% { opacity:0.8; } 90% { opacity:0.5; } 100% { transform:translateY(520px); opacity:0; } }
      @keyframes borderPulse { 0%,100% { stroke-opacity:0.6; } 50% { stroke-opacity:0.15; } }
      .glitch-base { animation:glitch1 3s infinite; }
      .glitch-r { animation:glitch2 2.5s infinite; }
      .glitch-b { animation:glitch3 3.2s infinite; }
      .scan-line { animation:scan 2s linear infinite; }
      .pulse-slow { animation:pulse 4s ease-in-out infinite; }
      .orbit-ring { animation:orbit 12s linear infinite; transform-origin:256px 256px; }
      .orbit-ring-reverse { animation:orbitReverse 15s linear infinite; transform-origin:256px 256px; }
      .cursor-blink { animation:blink 1s step-end infinite; }
      .matrix-char { animation:matrixFall 4s linear infinite; }
      .matrix-char:nth-child(2) { animation-delay:0.5s; }
      .matrix-char:nth-child(3) { animation-delay:1.2s; }
      .matrix-char:nth-child(4) { animation-delay:2s; }
      .matrix-char:nth-child(5) { animation-delay:0.8s; }
      .matrix-char:nth-child(6) { animation-delay:2.5s; }
      .matrix-char:nth-child(7) { animation-delay:1.8s; }
      .matrix-char:nth-child(8) { animation-delay:3s; }
      .matrix-char:nth-child(9) { animation-delay:0.3s; }
      .matrix-char:nth-child(10) { animation-delay:1.5s; }
      .border-anim { animation:borderPulse 3s ease-in-out infinite; }
    </style>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff88"/><stop offset="50%" stop-color="#00cc66"/><stop offset="100%" stop-color="#009944"/>
    </linearGradient>
    <linearGradient id="rGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="40%" stop-color="#b3ffd9"/><stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.5"/><stop offset="100%" stop-color="#00cc66" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="strongGlow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glitchFilter"><feGaussianBlur stdDeviation="1" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadowGlow"><feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#00ff88" flood-opacity="0.3"/></filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#020202" rx="20"/>

  <!-- Scan line overlay -->
  <g class="scan-line" opacity="0.04">
    <rect x="0" y="0" width="512" height="4" fill="#00ff88"/>
  </g>

  <!-- Matrix rain characters -->
  <g font-family="monospace" font-size="10" fill="#00ff88" opacity="0.15">
    <text class="matrix-char" x="40" y="-10">0</text>
    <text class="matrix-char" x="90" y="-10">1</text>
    <text class="matrix-char" x="150" y="-10">0</text>
    <text class="matrix-char" x="210" y="-10">1</text>
    <text class="matrix-char" x="300" y="-10">0</text>
    <text class="matrix-char" x="360" y="-10">1</text>
    <text class="matrix-char" x="420" y="-10">0</text>
    <text class="matrix-char" x="460" y="-10">1</text>
    <text class="matrix-char" x="110" y="-10">0</text>
    <text class="matrix-char" x="250" y="-10">1</text>
  </g>

  <!-- Main hexagon -->
  <path class="border-anim" d="M256 16 L484 140 L484 372 L256 496 L28 372 L28 140 Z" fill="#040404" stroke="url(#border)" stroke-width="2" filter="url(#shadowGlow)"/>
  <path d="M256 16 L484 140 L484 372 L256 496 L28 372 L28 140 Z" fill="none" stroke="url(#border)" stroke-width="0.8" opacity="0.15"/>

  <!-- Inner hex ring -->
  <path d="M256 50 L444 154 L444 358 L256 462 L68 358 L68 154 Z" fill="none" stroke="url(#border)" stroke-width="0.4" opacity="0.15"/>

  <!-- Orbital rings animated -->
  <g class="orbit-ring" opacity="0.08">
    <ellipse cx="256" cy="256" rx="180" ry="65" fill="none" stroke="url(#border)" stroke-width="0.8"/>
    <circle cx="436" cy="256" r="2.5" fill="#00ff88" opacity="0.5"/>
  </g>
  <g class="orbit-ring-reverse" opacity="0.06">
    <ellipse cx="256" cy="256" rx="195" ry="50" fill="none" stroke="url(#border)" stroke-width="0.6"/>
    <circle cx="61" cy="256" r="2" fill="#00cc66" opacity="0.4"/>
  </g>
  <g class="orbit-ring" style="animation-duration:18s;" opacity="0.05">
    <ellipse cx="256" cy="256" rx="160" ry="80" fill="none" stroke="url(#border)" stroke-width="0.5"/>
    <circle cx="416" cy="256" r="1.5" fill="#009944" opacity="0.3"/>
  </g>

  <!-- TOP SECRET stamp -->
  <g transform="rotate(-30 256 256)" opacity="0.04">
    <text x="256" y="275" font-family="monospace" font-size="24" font-weight="900" fill="#00ff88" text-anchor="middle" letter-spacing="5">TOP SECRET</text>
  </g>

  <!-- Warning triangle -->
  <g transform="translate(256,115)" opacity="0.08">
    <polygon points="0,-18 16,14 -16,14" fill="none" stroke="#00ff88" stroke-width="1.2"/>
  </g>

  <!-- Glitch color offsets on the R (Red offset) -->
  <g class="glitch-r" filter="url(#glitchFilter)">
    <path d="M 196 340 L 196 172 L 278 172 Q 320 172 320 210 Q 320 240 292 256 Q 320 265 334 285 L 340 294 L 316 294 L 290 260 Q 260 250 240 250 L 240 340 Z M 240 230 L 274 230 Q 294 230 294 210 Q 294 192 274 192 L 240 192 Z" fill="#ff0040" opacity="0.4"/>
  </g>

  <!-- Glitch color offsets on the R (Blue offset) -->
  <g class="glitch-b" filter="url(#glitchFilter)">
    <path d="M 196 340 L 196 172 L 278 172 Q 320 172 320 210 Q 320 240 292 256 Q 320 265 334 285 L 340 294 L 316 294 L 290 260 Q 260 250 240 250 L 240 340 Z M 240 230 L 274 230 Q 294 230 294 210 Q 294 192 274 192 L 240 192 Z" fill="#0040ff" opacity="0.3"/>
  </g>

  <!-- Main R -->
  <g class="glitch-base" filter="url(#glow)">
    <path d="M 196 340 L 196 172 L 278 172 Q 320 172 320 210 Q 320 240 292 256 Q 320 265 334 285 L 340 294 L 316 294 L 290 260 Q 260 250 240 250 L 240 340 Z M 240 230 L 274 230 Q 294 230 294 210 Q 294 192 274 192 L 240 192 Z" fill="url(#rGrad)"/>
  </g>

  <!-- Terminal cursor -->
  <rect class="cursor-blink" x="194" y="365" width="4" height="15" rx="1" fill="#00ff88" opacity="0.9" filter="url(#glow)"/>

  <!-- Hover glow ring (appears on hover) -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0" class="pulse-slow">
    <animate attributeName="opacity" values="0;0.08;0" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Digital circuit corners -->
  <g opacity="0.2">
    <path d="M 70 120 L 90 120 L 90 140 L 100 140" fill="none" stroke="url(#border)" stroke-width="1.2"/>
    <path d="M 442 120 L 422 120 L 422 140 L 412 140" fill="none" stroke="url(#border)" stroke-width="1.2"/>
    <path d="M 70 392 L 90 392 L 90 372 L 100 372" fill="none" stroke="url(#border)" stroke-width="1.2"/>
    <path d="M 442 392 L 422 392 L 422 372 L 412 372" fill="none" stroke="url(#border)" stroke-width="1.2"/>
  </g>

  <!-- Nodes on circuit -->
  <circle cx="100" cy="140" r="2.5" fill="#00ff88" opacity="0.3" class="pulse-slow"/>
  <circle cx="412" cy="140" r="2.5" fill="#00ff88" opacity="0.3" class="pulse-slow" style="animation-delay:1s;"/>
  <circle cx="100" cy="372" r="2.5" fill="#00cc66" opacity="0.3" class="pulse-slow" style="animation-delay:2s;"/>
  <circle cx="412" cy="372" r="2.5" fill="#00cc66" opacity="0.3" class="pulse-slow" style="animation-delay:0.5s;"/>

  <!-- Outer glow pulse -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#00ff88" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.06;0" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="240;248;240" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0">
    <animate attributeName="opacity" values="0;0.03;0" dur="4s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="r" values="248;260;248" dur="4s" repeatCount="indefinite" begin="1s"/>
  </circle>

  <!-- Scanning radar arc -->
  <path d="M 256 256 L 456 256 A 200 200 0 0 1 403 418 Z" fill="#00ff88" opacity="0">
    <animate attributeName="opacity" values="0;0.04;0" dur="4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" from="0 256 256" to="360 256 256" dur="4s" repeatCount="indefinite"/>
  </path>
</svg>
