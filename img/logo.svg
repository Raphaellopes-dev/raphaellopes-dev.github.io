<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020202"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="50%" stop-color="#00cc66"/>
      <stop offset="100%" stop-color="#009944"/>
    </linearGradient>
    <linearGradient id="rGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#b3ffd9"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background shield/hexagon -->
  <path d="M256 16 L484 140 L484 372 L256 496 L28 372 L28 140 Z" fill="url(#bg)" stroke="url(#border)" stroke-width="2"/>

  <!-- Inner hex rings -->
  <path d="M256 50 L444 154 L444 358 L256 462 L68 358 L68 154 Z" fill="none" stroke="url(#border)" stroke-width="0.5" opacity="0.2"/>

  <!-- TOP SECRET stamp -->
  <g transform="rotate(-25 256 256)" opacity="0.08">
    <text x="256" y="270" font-family="monospace" font-size="28" font-weight="900" fill="#00ff88" text-anchor="middle" letter-spacing="6">TOP SECRET</text>
  </g>

  <!-- Warning triangle -->
  <g transform="translate(256,130)" opacity="0.15">
    <polygon points="0,-20 18,16 -18,16" fill="none" stroke="#00ff88" stroke-width="1.5"/>
  </g>

  <!-- Scan lines effect -->
  <g opacity="0.03">
    <line x1="60" y1="200" x2="452" y2="200" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="60" y1="220" x2="452" y2="220" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="60" y1="240" x2="452" y2="240" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="60" y1="280" x2="452" y2="280" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="60" y1="300" x2="452" y2="300" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="60" y1="320" x2="452" y2="320" stroke="#00ff88" stroke-width="0.5"/>
  </g>

  <!-- Orbital rings -->
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="url(#border)" stroke-width="0.5" opacity="0.12" transform="rotate(-30 256 256)"/>
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="url(#border)" stroke-width="0.5" opacity="0.12" transform="rotate(30 256 256)"/>

  <!-- Quantum dots -->
  <circle cx="426" cy="218" r="2.5" fill="#00ff88" opacity="0.35"/>
  <circle cx="86" cy="294" r="2.5" fill="#00ff88" opacity="0.35"/>
  <circle cx="422" cy="306" r="2" fill="#00cc66" opacity="0.25"/>
  <circle cx="90" cy="206" r="2" fill="#00cc66" opacity="0.25"/>

  <!-- Glitch R letter -->
  <g filter="url(#glow)">
    <path d="
      M 196 340 L 196 172 L 278 172
      Q 320 172 320 210 Q 320 240 292 256
      Q 320 265 334 285 L 340 294 L 316 294
      L 290 260 Q 260 250 240 250 L 240 340 Z
      M 240 230 L 274 230 Q 294 230 294 210
      Q 294 192 274 192 L 240 192 Z
    " fill="url(#rGrad)"/>
  </g>

  <!-- Glitch offset copy (glitch effect) -->
  <path d="
    M 196 340 L 196 172 L 278 172
    Q 320 172 320 210 Q 320 240 292 256
    Q 320 265 334 285 L 340 294 L 316 294
    L 290 260 Q 260 250 240 250 L 240 340 Z
    M 240 230 L 274 230 Q 294 230 294 210
    Q 294 192 274 192 L 240 192 Z
  " fill="none" stroke="#ff0066" stroke-width="1.5" transform="translate(2,0)" opacity="0.3" clip-path="inset(0 50% 0 0)"/>

  <!-- Terminal cursor blink -->
  <g filter="url(#strongGlow)">
    <rect x="194" y="365" width="4" height="18" rx="1" fill="#00ff88" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.05;0.8" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Corner brackets with glow -->
  <g opacity="0.35">
    <path d="M 80 120 L 100 120 L 100 140" fill="none" stroke="url(#border)" stroke-width="1.5"/>
    <path d="M 432 120 L 412 120 L 412 140" fill="none" stroke="url(#border)" stroke-width="1.5"/>
    <path d="M 80 392 L 100 392 L 100 372" fill="none" stroke="url(#border)" stroke-width="1.5"/>
    <path d="M 432 392 L 412 392 L 412 372" fill="none" stroke="url(#border)" stroke-width="1.5"/>
  </g>

  <!-- Outter glow -->
  <path d="M256 16 L484 140 L484 372 L256 496 L28 372 L28 140 Z" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.06" filter="url(#strongGlow)"/>
</svg>
